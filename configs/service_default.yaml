app:
  name: "axiomod-service"
  environment: "local"
  version: "1.0.0"
  debug: true

observability:
  logLevel: "info"
  logFormat: "json"
  tracingEnabled: false
  tracingExporterType: "jaeger" # Options: jaeger, otlp, stdout
  tracingUrl: "http://localhost:14268/api/traces"
  tracingInsecure: true # local dev only -- keep false (TLS) in production
  tracingSamplerRatio: 1.0
  metricsEnabled: true # served at /metrics on the HTTP port

database:
  driver: "postgres" # Options: postgres, mysql
  host: "localhost"
  port: 5432
  user: "axiomod"
  password: "password"
  name: "axiomod"
  sslMode: "disable"
  orm: "ent" # Options: ent (default), sql (plain database/sql repositories)
  maxOpenConns: 25
  maxIdleConns: 5
  connMaxLifetime: 15 # minutes
  slowQueryThreshold: 200 # milliseconds

http:
  port: 8080
  host: "0.0.0.0"
  readTimeout: 10
  writeTimeout: 10

grpc:
  port: 9090
  host: "0.0.0.0"

auth:
  oidc:
    # OIDC is opt-in: leave issuerUrl empty to disable discovery/verification.
    # Example: "https://keycloak.example.com/realms/axiomod"
    issuerUrl: ""
    clientId: "axiomod-client"
    clientSecret: "" # set via APP_AUTH_OIDC_CLIENTSECRET
    jwksCacheTtl: 60 # minutes
  jwt:
    # DEV PLACEHOLDER -- must be overridden in every deployment, e.g. via
    # APP_AUTH_JWT_SECRETKEY. Minimum 32 bytes; startup fails otherwise.
    secretKey: "dev-only-insecure-secret-change-me-now"
    tokenDuration: 60 # minutes

casbin:
  modelPath: "./configs/rbac_model.conf"
  policyPath: "./configs/rbac_policy.csv"
  table: "casbin_rule"

plugins:
  enabled:
    postgres: false # enable when a PostgreSQL instance is reachable (see database section)
    mysql: false
    redis: false
    kafka: false
    jwt: true
    keycloak: false
    ldap: false
    saml: false
    multitenancy: false
    auditing: false
    elk: false
  settings:
    multitenancy:
      header: "X-Tenant-ID"
      required: false
    auditing:
      filePath: "" # optional JSON-lines audit log, e.g. "./audit.jsonl"
    elk:
      elasticsearchUrl: "http://localhost:9200"
      index: "axiomod-logs"
      flushInterval: "5s"
      bufferSize: 256
    redis:
      addr: "localhost:6379"
      password: ""
      db: 0
    kafka:
      brokers: ["localhost:9092"]
      clientId: "axiomod"
      timeout: "10s"
    ldap:
      url: "ldap://localhost:389"
      bindDn: "cn=service,dc=example,dc=com"
      bindPassword: "" # set via APP_PLUGINS_SETTINGS_LDAP_BINDPASSWORD
      baseDn: "ou=people,dc=example,dc=com"
      userFilter: "(uid=%s)"
    saml:
      entityId: "http://localhost:8080/saml/metadata"
      acsUrl: "http://localhost:8080/saml/acs"
      idpMetadataUrl: "" # or idpMetadataFile
