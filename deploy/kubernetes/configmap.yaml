apiVersion: v1
kind: ConfigMap
metadata:
  name: axiomod-config
  labels:
    app: axiomod
data:
  # Mounted at /app/configs/service_default.yaml. Secrets (database password,
  # JWT secret) come from the axiomod-secrets Secret via APP_* env vars and
  # override these values.
  service_default.yaml: |
    app:
      name: "axiomod-service"
      environment: "production"
      version: "0.2.0"
      debug: false

    observability:
      logLevel: "info"
      logFormat: "json"
      tracingEnabled: false
      tracingExporterType: "otlp"
      tracingSamplerRatio: 0.1
      metricsEnabled: true

    http:
      host: "0.0.0.0"
      port: 8080
      readTimeout: 10
      writeTimeout: 10

    grpc:
      host: "0.0.0.0"
      port: 9090

    database:
      driver: "postgres"
      host: "postgres"
      port: 5432
      user: "axiomod"
      password: "" # injected via APP_DATABASE_PASSWORD
      name: "axiomod"
      sslMode: "require"
      orm: "ent"

    auth:
      jwt:
        secretKey: "" # injected via APP_AUTH_JWT_SECRETKEY
        tokenDuration: 60

    plugins:
      enabled:
        postgres: true
        jwt: true
      settings: {}
