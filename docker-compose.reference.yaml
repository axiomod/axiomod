services:
  app:
    build: .
    ports:
      - "8080:8080" # HTTP (Prometheus metrics at /metrics)
      - "9090:9090" # gRPC
    environment:
      # Environment overrides use the APP_ prefix; dots in Viper keys become
      # underscores (e.g. database.host -> APP_DATABASE_HOST).
      - APP_APP_ENVIRONMENT=local
      - APP_DATABASE_HOST=postgres
      - APP_DATABASE_USER=${POSTGRES_USER:-axiomod}
      - APP_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-password}
      - APP_PLUGINS_ENABLED_POSTGRES=true
      - APP_PLUGINS_ENABLED_REDIS=true
      - APP_PLUGINS_SETTINGS_REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - kafka
      - redis

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axiomod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: axiomod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  jaeger:
    image: jaegertracing/all-in-one:1.41
    ports:
      - "16686:16686" # UI
      - "14268:14268" # Collector
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090" # host 9090 is taken by the app's gRPC port
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres_data:
