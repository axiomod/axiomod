name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Verify dependencies
      run: go mod verify

    - name: Format Check
      run: |
        gofmt -l . > fmt.out
        if [ -s fmt.out ]; then
          echo "Code is not formatted:"
          cat fmt.out
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.5.0

    - name: Test
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Coverage report
      run: |
        go tool cover -func=coverage.out | tail -1
        total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
        threshold=50
        echo "Total coverage: ${total}% (threshold: ${threshold}%)"
        if [ "$(echo "$total < $threshold" | bc)" -eq 1 ]; then
          echo "Coverage ${total}% is below the ${threshold}% threshold"
          exit 1
        fi

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v6
      with:
        name: coverage
        path: coverage.out

    - name: Build
      run: go build -v ./cmd/axiomod-server

    - name: Build CLI
      run: go build -o bin/axiomod ./cmd/axiomod

    - name: Architecture validation
      run: ./bin/axiomod validator architecture

    - name: Scaffold smoke test
      run: |
        set -eu
        CLI="$GITHUB_WORKSPACE/bin/axiomod"
        TMP="$(mktemp -d)"
        cd "$TMP"
        "$CLI" init smoke-service --dev --framework-path "$GITHUB_WORKSPACE"
        cd smoke-service
        go mod tidy
        go build ./...
        go vet ./...
